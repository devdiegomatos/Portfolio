baseURL: https://www.devdiegomatos.com.br/
locale: pt-br
title: Desenvolvedor Diego Matos
theme: PaperMod

params:
  # env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Desenvolvedor Diego Matos
  description: "Página principal do desenvolvedor Diego Matos, veja seus projetos, entre em contato, baixe seu curriculum ou olhe o código desse site em sua página do GitHub."
  keywords: [Blog, Portfolio, PaperMod]
  author: Diego Matos
  # images: ["<link or path of image for opengraph, twitter-cards>"]

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  showtoc: true

  # home-info mode
  homeInfoParams:
    Title: "Oi \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/devdiegomatos"
    - name: github
      url: "https://github.com/devdiegomatos"
  
  assets:
    favicon: "/favicon/favicon.ico"
    favicon16x16: "/favicon/favicon-16x16.png"
    favicon32x32: "/favicon/favicon-32x32.png"
    apple_touch_icon: "/favicon/favicon-32x32.png" # Opcional
  
menus:
  main:
  - name: Projetos
    pageRef: /projetos/
    weight: 10
  - name: Trabalhos
    pageRef: /trabalhos/
    weight: 20
  - name: Pesquisar
    pageRef: /search/
    weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search