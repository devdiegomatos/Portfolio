baseURL: https://www.devdiegomatos.com.br/
locale: pt-br
title: Desenvolvedor Diego Matos
theme: PaperMod

params:
  env: production
  title: Desenvolvedor Diego Matos
  description: "Página principal do desenvolvedor Diego Matos, veja seus projetos, entre em contato, baixe seu curriculum ou olhe o código desse site em sua página do GitHub."
  keywords: [Blog, Portfolio, PaperMod]
  author: Diego Matos
  # images: ["<link or path of image for opengraph, twitter-cards>"]

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  showtoc: true

  mainSections: ["trabalhos", "projetos"]

  # home-info mode
  homeInfoParams:
    Title: "Oi, eu sou Diego Matos 👋"
    Content: >-
      Sou desenvolvedor e uso este espaço para reunir meus trabalhos, projetos e,
      em breve, artigos sobre programação, tecnologia e aprendizado contínuo.
      Fique à vontade para explorar o que já construí e acompanhar a evolução deste portfólio.

  socialIcons:
    - name: email
      url: "mailto:diego@devdiegomatos.com.br"
    - name: linkedin
      url: "https://www.linkedin.com/in/devdiegomatos"
    - name: github
      url: "https://github.com/devdiegomatos"
  
  assets:
    favicon: "/favicon/favicon.ico"
    favicon16x16: "/favicon/favicon-16x16.png"
    favicon32x32: "/favicon/favicon-32x32.png"
    apple_touch_icon: "/favicon/favicon-32x32.png" # Opcional
  
menus:
  main:
  - name: Trabalhos
    pageRef: /trabalhos/
    weight: 10
  - name: Projetos
    pageRef: /projetos/
    weight: 20
  - name: Archives
    pageRef: /archives/
    weight: 30
  - name: Pesquisar
    pageRef: /search/
    weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search